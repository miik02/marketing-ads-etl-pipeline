name: ETL Marketing Automático

on:
  schedule:
    - cron: '0 4 * * *'  # Se ejecuta automáticamente todos los días a las 04:00 AM UTC
  workflow_dispatch:     # Añade un botón manual en la interfaz para pruebas

jobs:
  ejecutar-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install pandas numpy sqlalchemy psycopg2-binary

      - name: Ejecutar Pipeline ETL
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          python generate_mock_data.py
          python data_automation.py
